  cv.style.width = (cv.width / dpr) + 'px';

function update(dt) {
  t += dt; stateT += dt;
  if (shakeT > 0) shakeT -= dt;
  if (toast) { toast.t += dt; if (toast.t > 90) toast = null; }
  for (const p of dust) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.05 * dt; p.life -= dt; }
  dust = dust.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.4 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  if (state === 'splash') { if (stateT > 170) enterMenu(); return; }
  if (state === 'revive') { if (stateT > 330) setState('dying'); return; }
  if (state === 'ad') { if (stateT > 180) doRevive(); return; }
  if (state !== 'play' && state !== 'dying') return;
  if (state === 'dying') {
    shake = Math.max(0, shake - 0.4 * dt);
    ghost.y -= 0.6 * dt * ghost.side;
    if (stateT > 50) { finishRun(); setState('over'); }
    return;
  }
  if (mode === 'run') speed = speedFor(score);
  const steps = Math.max(1, Math.ceil(speed * dt / 3));
  for (let i = 0; i < steps && state === 'play'; i++) stepRunner(dt / steps);
  if (state !== 'play') return;
  const ns = Math.floor(dist / 10);
  if (ns !== score) {
    score = ns;
    if (mode === 'run' && score >= lastMilestone + 100) { lastMilestone = score - (score % 100); beep(880, 1320, 0.15, 'triangle', 0.06); }
  }
  if (!passedBest && score > bestAtStart) { passedBest = true; showBanner({ a: T('rec'), c: YEL }); beep(660, 1760, 0.35, 'triangle', 0.07); }
  if (flash > 0) flash = Math.max(0, flash - 0.04 * dt);
  if (banner) { banner.t += dt; if (banner.t > 140) banner = bannerQ.shift() || null; }
}

function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

    ctx.fillRect(px, gy, 1, PIT_D + 1); ctx.fillRect(px + pw, gy, 1, PIT_D + 1); ctx.fillRect(px, gy + PIT_D, pw + 1, 1);
    x = Math.max(x, px + pw + 1);

  if (x < W) ctx.fillRect(x, gy, W - x, 1);
  const start = Math.floor(sc / 3), depth = Math.max(34, VH - OY - gy - 4);
  for (let i = start; i < start + W / 3 + 2; i++) {
    const sx = r2(i * 3 - sc);
    for (let k = 0; k < 4; k++) {
      if (hash(i * 7 + k * 13) > 0.5) continue;
      const ry = hash(i * 3 + k * 29), y = gy + 3 + Math.floor(ry * ry * depth * 2) / 2;
      let blocked = false;
      for (const p of pitList) if (sx >= p.x - 1 && sx <= p.x + p.w + 1 && y < gy + PIT_D + 3) blocked = true;
      if (!blocked) { const big = hash(i * 11 + k) < 0.25; ctx.fillRect(sx, y, big ? 1 : 0.5, big ? 1 : 0.5); }
    }
  }
  ctx.fillStyle = FG;
}
function drawHills(sc, b) {

  ctx.beginPath(); ctx.moveTo(0, GY);

  ctx.lineTo(W, GY); ctx.closePath();
  ctx.fillStyle = dither(B.bg2, 2); ctx.fill();
  ctx.fillStyle = B.bg2;
  for (let x = 0; x < W; x += 0.5) ctx.fillRect(x, Math.round(hy(x) * 2) / 2, 0.5, 1);
  const s0 = Math.floor(sc / 47);
  for (let i = s0; i < s0 + 6; i++) {
    if (hash(i * 5) < 0.45) continue;
    const x = r2(i * 47 - sc + hash(i) * 20); if (x < -6 || x > W) continue;
    const y = Math.round(hy(x) * 2) / 2;

const REV_AD = { x: 24, y: 168, w: 132, h: 22 }, REV_KEY = { x: 24, y: 196, w: 132, h: 22 }, REV_NO = { x: 50, y: 228, w: 80, h: 16 };
function drawRevive() {
  drawPlayScene();
  ctx.globalAlpha = 0.75; ctx.fillStyle = '#0b0918'; ctx.fillRect(0, -OY, W, VH); ctx.globalAlpha = 1;
  panel(14, 80, 152, 176, MINT);
  text(T('cont'), W / 2, 92, 2, true, 'c', MINT);
  const left = Math.max(0, 1 - stateT / 330);
  ctx.fillStyle = DIM; hexFill(W / 2, 134, 22); ctx.fillStyle = MINT;
  const R = 22, Rh = R * 0.866;
  for (let y = -Rh; y <= Rh; y += 0.5) { if ((y + Rh) / (2 * Rh) < 1 - left) continue; const hw = Math.round((R - Math.abs(y) / Rh * (R / 2)) * 2) / 2; ctx.fillRect(W / 2 - hw, Math.round((134 + y) * 2) / 2, hw * 2, 0.5); }
  text(String(Math.ceil(left * 5)), W / 2, 128, 2, true, 'c', '#15122b');
  if (passActive()) drawButton(T('free'), REV_AD, true, MINT);
  else drawButton('▶ ' + T('watchAd'), REV_AD, true, MINT);
  ctx.globalAlpha = save.keys > 0 ? 1 : 0.4; drawButton(T('useKey') + ' (' + save.keys + ')', REV_KEY, false, YEL); ctx.globalAlpha = 1;
  drawButton(T('noThanks'), REV_NO);
}
function drawAdDemo() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, -OY, W, VH);
  panel(20, 110, 140, 90, YEL, '#111');
  text(T('adDemo'), W / 2, 124, 2, true, 'c', YEL);
  text(T('noPay'), W / 2, 146, 1, false, 'c', TXT);
  box(40, 170, 100, 8, TXT); ctx.fillStyle = YEL; ctx.fillRect(42, 172, r2(96 * Math.min(1, stateT / 180)), 4);
}

/* ================= Jeu ================= */
function drawPortal(o) {
  const x = r2(o.x), col = BIOMES[2].line;
  for (let y = CY; y < GY; y += 0.5) {
    const w = Math.sin((y - CY) / (GY - CY) * Math.PI) * 7 + 2;
    const sw = Math.sin(y * 0.15 + t * 0.25) * 1.5;
    ctx.fillStyle = col; ctx.fillRect(x - w + sw, y, 1, 0.5); ctx.fillRect(x + w + sw, y, 1, 0.5);
    if ((Math.floor(y * 2) + (t | 0)) % 9 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(x + sw * 2, y, 0.5, 0.5); }
  }
  ctx.globalAlpha = 0.18; ctx.fillStyle = col; ctx.fillRect(x - 6, CY, 12, GY - CY); ctx.globalAlpha = 1;
}
function drawPlayScene() {
  const B = curB();
  drawStars(B.line);
  if (biome === 3) { ctx.fillStyle = '#dfe8ff'; spr(MOON, 130, 20, 4); }
  drawHills(scroll * 0.25, biome);
  ctx.fillStyle = B.line; ctx.globalAlpha = 0.5; for (const c of clouds) spr(c.big ? CLOUD_L : CLOUD_S, c.x, c.y); ctx.globalAlpha = 1;
  if (biome === 2) { // plafond du manoir
    ctx.fillStyle = B.line; ctx.fillRect(0, CY, W, 1);
    ctx.fillStyle = dither(B.bg2); ctx.fillRect(0, CY - 30, W, 30);
    for (let i = Math.floor(scroll / 40); i < Math.floor(scroll / 40) + 6; i++) { const x = r2(i * 40 - scroll); ctx.fillStyle = B.ob2; ctx.fillRect(x, CY - 30, 2, 30); }
  }
  ctx.fillStyle = TXT; for (const tf of tufts) if (!inPit(tf.x + 2) && !inPit(tf.x + 8)) spr(TUFT, tf.x, GY - 5);
  if (mode === 'run' && !passedBest) {
    const rx = r2(GX + 13 + (bestAtStart * 10 - dist));
    if (rx > -4 && rx < W + 40) { ctx.fillStyle = YEL; for (let y = GY - 70; y < GY; y += 3) ctx.fillRect(rx, y, 0.5, 1.5); text(T('best'), rx + 3, GY - 76, 1, false, 'l', YEL); }
  }
  if (mode === 'story' && finishX < W + 20) {
    const fx = r2(finishX); ctx.fillStyle = TXT; ctx.fillRect(fx, GY - 56, 1, 56);
    for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 0) ctx.fillRect(fx + 1 + c * 1.5, GY - 56 + r * 1.5, 1.5, 1.5);
  }
  for (const o of obstacles) {
    if (o.x > W + 30 || o.x < -40) continue;
    if (o.type === 'portal') { drawPortal(o); continue; }
    if (o.type === 'bat') { ctx.fillStyle = BATC; const s = biome === 1 ? OWL : BAT; if (o.side < 0) sprFlipY(s[((t / 6) | 0) % 2], o.x, o.y); else spr(s[((t / 6) | 0) % 2], o.x, o.y); }
    else {
      ctx.fillStyle = o.spr === CHAND ? YEL : B.ob;
      if (o.side < 0) sprFlipY(o.spr, o.x, CY); else spr(o.spr, o.x, GY - o.h + 1);
    }
  }
  ctx.fillStyle = YEL; for (const c of coins) if (c.x < W + 20) spr(coinFrame(((t / 6) | 0) + (c.x | 0)), c.x, c.y, 2);
  for (const s of starsL) if (s.x < W + 20) { ctx.fillStyle = YEL; spr(STAR, s.x, s.y + Math.sin(t * 0.1 + s.x) * 1.5, 2); }
  for (const p of pickups) if (p.x < W + 20) {
    const yy = p.y + Math.sin(t * 0.12 + p.x) * 2;
    if (p.key) { ctx.globalAlpha = 0.3; ctx.fillStyle = YEL; ctx.fillRect(p.x - 2, yy - 2, 20, 14); ctx.globalAlpha = 1; ctx.fillStyle = YEL; spr(KEY, p.x, yy, 2); }
    else drawItem(p.rar, p.x, yy, 2, true);
  }
  drawGround(scroll, pits, GY, B.line);
  // brume de la forêt : cache les obstacles au loin
  if (biome === 1) {
    const dens = 0.55 + 0.35 * Math.sin(dist * 0.003);
    const fx0 = GX + 62 + Math.sin(t * 0.03) * 6;
    ctx.globalAlpha = Math.max(0, Math.min(0.92, dens)); ctx.fillStyle = B.bg;
    ctx.fillRect(fx0 + 10, GY - 90, W - fx0, 96);
    ctx.globalAlpha = 1; ctx.fillStyle = dither(B.fog, 1);
    ctx.fillRect(fx0, GY - 90, W - fx0, 96);
    ctx.fillStyle = B.fog; ctx.globalAlpha = 0.3;
    for (let y = GY - 90; y < GY + 6; y += 2) ctx.fillRect(fx0 + Math.sin(y * 0.2 + t * 0.05) * 4, y, 10, 2);
    ctx.globalAlpha = 1;
  }
  drawDust();
  for (const p of popups) text(p.txt, p.x, p.y, 1, true, 'c', p.c);
  const dying = state === 'dying';
  if (!(dying && (stateT / 4 | 0) % 2) && !(ghost.inv > 0 && ((t / 4) | 0) % 2)) {
    const squash = ghost.land > 0 ? 1 : 0;
    const look = ghost.vy * ghost.side < -1 ? '0' : '1';
    if (ghost.side < 0) { ctx.save(); ctx.translate(0, ghost.y * 2); ctx.scale(1, -1); drawGhost(GX, ghost.y + squash, (t / 8) | 0, dying || state === 'revive', save.skin, 2, { look: dying ? null : look, fx: false }); ctx.restore(); }
    else drawGhost(GX, ghost.y + squash, (t / 8) | 0, dying || state === 'revive', save.skin, 2, { look, fx: false });
  }
}
function drawHUD() {
  screenT();
  panel(8, 8, 16, 16, TXT, '#00000055'); ctx.fillStyle = TXT; ctx.fillRect(13, 12, 2, 8); ctx.fillRect(17, 12, 2, 8);
  if (mode === 'story') {
    const prog = Math.max(0, Math.min(1, 1 - (finishX - GX) / levelLen));
    box(32, 12, 92, 8, TXT); ctx.fillStyle = MINT; ctx.fillRect(34, 14, r2(88 * prog), 4);
    for (let s = 0; s < 3; s++) drawStarIcon(130 + s * 15, 10, 2, s < runStars);
    drawCoinCount(runCoins, W - 8, 28);
  } else {
    text(pad(score), W - 8, 10, 2, true, 'r', YEL);
    drawCoinCount(runCoins, W - 8, 28);
    text(T('biome')[biome], 30, 14, 1, false, 'l', curB().line);
  }
  if (runKeys || save.keys) drawKeyCount(save.keys + runKeys, W - 8, 41);
  sceneT();
  if (banner && (banner.t < 110 || ((banner.t / 5) | 0) % 2)) {
    const bw = Math.max(textW(banner.a, 1), banner.b ? textW(banner.b, 1) : 0) + 12;
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#0b0918'; ctx.fillRect(W / 2 - bw / 2, 106, bw, banner.b ? 28 : 18); ctx.globalAlpha = 1;
    box(W / 2 - bw / 2, 106, bw, banner.b ? 28 : 18, banner.c || TXT);
    text(banner.a, W / 2, 111, 1, true, 'c', banner.c || TXT);
    if (banner.b) text(banner.b, W / 2, 122, 1, false, 'c', TXT);
  }
  if (state === 'pause') {
    panel(18, 100, 144, 96, UI, MENU_BG);
    text(T('pause'), W / 2, 112, 3, true, 'c', TXT);
    text(T('resume'), W / 2, 142, 1, false, 'c', TXT);
    drawButton(T('menu'), PAUSE_MENU);
  }
}
const PAUSE_MENU = { x: 50, y: 166, w: 80, h: 18 };

function render() {
  sceneT();
  if (state === 'splash') { document.body.style.background = stateT > 150 ? MENU_BG : RED; return drawSplash(); }
  const inGame = ['play', 'pause', 'dying', 'revive', 'ad'].includes(state);
  BG = inGame ? curB().bg : (state === 'levels' ? BIOMES[lvPage % 4].bg : MENU_BG); FG = TXT;
  if (document.body.style.background !== BG) document.body.style.background = BG;
  screenT(); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, VH);
  if (shake > 0 && (state === 'dying' || state === 'revive')) sceneT(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  else sceneT();
  ctx.fillStyle = FG;
  if (state === 'menu') drawMenu();
  else if (state === 'gift') drawGift();
  else if (state === 'over') drawOver();
  else if (state === 'shop') drawShop();
  else if (state === 'premium') drawPremium();
  else if (state === 'inv') drawInv();
  else if (state === 'levels') drawLevels();
  else if (state === 'clear') drawClear();
  else if (state === 'revive') drawRevive();
  else if (state === 'ad') drawAdDemo();
  else { drawPlayScene(); drawHUD(); }
  if (flash > 0) { screenT(); ctx.globalAlpha = flash * 0.6; ctx.fillStyle = curB().line; ctx.fillRect(0, 0, W, VH); ctx.globalAlpha = 1; sceneT(); }
  if (chestResult && chestResult.t > 0) chestResult.t -= 1;
  drawAdBanner();
}

/* ================= Achats ================= */
function selectOrBuy(sk) {
  if (save.skins.includes(sk.id)) { save.skin = sk.id; beep(660, 990, 0.08); }
  else if (save.coins >= sk.price) { save.coins -= sk.price; save.skins.push(sk.id); save.skin = sk.id; beep(880, 1760, 0.2, 'triangle', 0.07); }
  else { shake_i = sk.id; shakeT = 18; beep(200, 120, 0.15, 'square', 0.05); return; }
  persist();
}
function grant(p) {
  if (p.pass) save.passUntil = Math.max(Date.now(), save.passUntil) + 7 * 864e5;
  else { save.coins += p.coins; const got = addKeys(p.keys || 0); if ((p.keys || 0) > got) save.coins += ((p.keys || 0) - got) * 100; }
  persist(); toast = { a: T('thanks'), t: 0 }; beep(880, 1760, 0.3, 'triangle', 0.07);
  setState(state);
}
async function buy(p) {
  if (window.PhantoIAP && typeof window.PhantoIAP.purchase === 'function') {
    try { if (await window.PhantoIAP.purchase(p.id)) grant(p); } catch (e) {}
  } else modal = p;
}

/* ================= Entrées ================= */
const hit = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const hexHit = (p, c, pd = 3) => p && Math.hypot(p.x - c.x, p.y - c.y) <= c.r + pd;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  const sy = (e.clientY - r.top) / r.height * VH;
  return { x: (e.clientX - r.left) / r.width * W, y: sy - OY, sy };
}
function go(s) { setState(s); beep(500, 700, 0.05); }
function press(p) {
  audio();
  if (state === 'splash') { if (stateT > 20) enterMenu(); return; }
  if (state === 'gift') { if (stateT > 15 && (!p || hit(p, GIFT_BTN))) claimGift(); return; }
  if (state === 'menu') {
    if (p && hit({ x: p.x, y: p.sy }, LANG_BTN)) { save.lang = LANGS[(LANGS.indexOf(save.lang) + 1) % LANGS.length]; persist(); beep(500, 700, 0.05); return; }
    if (p && hit({ x: p.x, y: p.sy }, SND_BTN)) { save.muted = !save.muted; persist(); beep(500, 700, 0.05); return; }
    if (p && p.sy < 32 && p.x > 110) return go('premium');
    if (!p || hexHit(p, PLAY, 6)) return startGame('run');
    if (hexHit(p, ORB.story)) { const nxt = Math.max(0, save.story.length); lvPage = Math.min(Math.floor(Math.min(nxt, NLEVELS - 1) / LV_PAGE), Math.ceil(NLEVELS / LV_PAGE) - 1); return go('levels'); }
    if (hexHit(p, ORB.inv)) { invTab = 0; return go('inv'); }
    if (hexHit(p, ORB.skins)) { shopTab = 0; preview = null; return go('shop'); }
    if (hexHit(p, ORB.noads)) return go('premium');
    if (hit(p, DAILY_PANEL)) { invTab = 2; return go('inv'); }
    return;
  }
  if (state === 'levels') {
    if (!p) { const nxt = Array.from({ length: NLEVELS }, (_, i) => i).find(i => levelUnlocked(i) && levelStars(i) < 0); return startGame('story', nxt == null ? 0 : nxt); }
    if (hit(p, BACK_BTN)) return go('menu');
    const np = Math.ceil(NLEVELS / LV_PAGE);
    if (hit(p, LV_L)) { lvPage = (lvPage + np - 1) % np; return beep(500, 600, 0.04); }
    if (hit(p, LV_R)) { lvPage = (lvPage + 1) % np; return beep(500, 600, 0.04); }
    for (let j = 0; j < LV_PAGE; j++) { const i = lvPage * LV_PAGE + j; if (i < NLEVELS && hexHit(p, lvlPos(j), 4)) { if (levelUnlocked(i)) return startGame('story', i); return beep(200, 120, 0.15, 'square', 0.05); } }
    return;
  }
  if (state === 'inv') {
    if (!p) return;
    if (hit(p, BACK_BTN)) return go('menu');
    for (let i = 0; i < 4; i++) if (hit(p, invTab_(i))) { invTab = i; return beep(500, 700, 0.04); }
    if (invTab === 0 && hit(p, NAME_BTN)) return editName();
    if (invTab === 1) {
      for (let i = 0; i < 4; i++) { const b = sellBtn(i); b.y = 52 + i * 34 + 8; if (hit(p, b) && save.items[i] > 0) { save.items[i]--; save.coins += RARITY[i].value; persist(); return beep(1320, 1980, 0.08, 'square', 0.04); } }
      if (hit(p, SELL_ALL)) { const tot = save.items.reduce((a, n, i) => a + n * RARITY[i].value, 0); if (tot) { save.coins += tot; save.items = [0, 0, 0, 0]; persist(); beep(880, 1760, 0.3, 'triangle', 0.07); } return; }
      if (hit(p, CHEST_BTN)) return openChest();
    }
    if (invTab === 2) {
      rollStats();
      const d = dailyChallenge();
      const rows = [{ c: d, s: save.stats, id: 'd' + dayKey() }].concat(WEEKLY.map((c, i) => ({ c, s: save.wstats, id: 'w' + i + weekKey() })));
      rows.forEach((r, i) => {
        const b = chClaim(i); b.y = 52 + i * 50 + 22;
        if (hit(p, b) && chProgress(r.c, r.s) >= r.c.n && !save.claimedCh[r.id]) { save.claimedCh[r.id] = 1; save.coins += r.c.r; if (r.c.key) addKeys(r.c.key); persist(); beep(880, 1760, 0.3, 'triangle', 0.07); }
      });
    }
    return;
  }
  if (state === 'premium') {
    if (!p) return;
    if (modal) { if (hit(p, MOD_OK)) { grant(modal); modal = null; } else if (hit(p, MOD_NO)) modal = null; return; }
    if (hit(p, { x: 40, y: 276, w: 100, h: 22 })) return go('menu');
    if (!passActive() && hit(p, PASS_BTN)) return buy({ ...PASS, pass: true });
    for (let i = 0; i < PACKS.length; i++) if (hit(p, packRow(i))) return buy(PACKS[i]);
    return;
  }
  if (state === 'shop') {
    if (!p) return;
    if (hit(p, SHOP_BACK)) return go('menu');
    for (let i = 0; i < 2; i++) if (hit(p, TAB[i])) { shopTab = i; preview = null; return beep(500, 700, 0.04); }
    if (hit(p, BUY_BTN)) return selectOrBuy(skinById(preview || save.skin));
    if (shopTab === 0) {
      if (hit(p, PG_L)) { shopPage = (shopPage + PAGES - 1) % PAGES; return beep(500, 600, 0.04); }
      if (hit(p, PG_R)) { shopPage = (shopPage + 1) % PAGES; return beep(500, 600, 0.04); }
    }
    const list = shopList();
    for (let j = 0; j < list.length; j++) if (hit(p, card(j))) {
      const s = list[j];
      if (preview === s.id || save.skins.includes(s.id)) { preview = s.id; return selectOrBuy(s); }
      preview = s.id; return beep(600, 800, 0.04);
    }
    return;
  }
  if (state === 'revive') {
    if (stateT < 12) return;
    if (!p || hit(p, REV_AD)) { if (passActive()) return doRevive(); return reviveWithAd(); }
    if (hit(p, REV_KEY)) { if (save.keys > 0) { save.keys--; persist(); return doRevive(); } return beep(200, 120, 0.15, 'square', 0.05); }
    if (hit(p, REV_NO)) return setState('dying');
    return;
  }
  if (state === 'clear') {
    if (stateT < 40) return;
    if (!p || hit(p, BTN)) { if (levelIdx + 1 < NLEVELS) return startGame('story', levelIdx + 1); return go('levels'); }
    if (hit(p, SUB)) { lvPage = Math.floor(levelIdx / LV_PAGE); return go('levels'); }
    return;
  }
  if (state === 'over') {
    if (stateT < 25) return;
    if (!p || hit(p, BTN)) return startGame(mode, levelIdx);
    if (hit(p, SUB)) { if (mode === 'story') lvPage = Math.floor(levelIdx / LV_PAGE); return setState(mode === 'story' ? 'levels' : 'menu'); }
    return;
  }
  if (state === 'pause') {
    if (hit(p, PAUSE_MENU)) { finishRun(); return setState(mode === 'story' ? 'levels' : 'menu'); }
    setState('play'); return;
  }
  if (state === 'play') {
    if (p && p.x < 34 && p.sy < 34) { setState('pause'); return; }
    jump();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(toLogical(e)); });
addEventListener('keydown', e => {
  if (e.target && e.target.id === 'nameInput') return;
  const k = e.code;
  if (e.repeat) return;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') { e.preventDefault(); press(null); }
  else if (k === 'KeyP' || k === 'Escape') window.phantoBack();
  else if (k === 'KeyM') { save.muted = !save.muted; persist(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('pause'); });
window.phantoBack = () => {
  if (state === 'play') { setState('pause'); return true; }
  if (state === 'pause') { setState('play'); return true; }
  if (state === 'revive') { setState('dying'); return true; }
  if (state === 'premium' && modal) { modal = null; return true; }
  if (['shop', 'premium', 'inv', 'levels', 'gift'].includes(state)) { setState('menu'); return true; }
  if (state === 'over' || state === 'clear') { setState(mode === 'story' ? 'levels' : 'menu'); return true; }
  return false;
};
window.phantoPause = () => { if (state === 'play') setState('pause'); };

/* ================= Boucle ================= */
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
resetCommon();
let last = performance.now();
function loop(now) {
  const dt = Math.min(3, (now - last) / (1000 / 60));
  last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__phanto = { get state() { return state; }, set score(v) { dist = v * 10; }, save, setState, startGame, enterMenu,
  shop: (tab, page) => { shopTab = tab; shopPage = page || 0; setState('shop'); }, inv: i => { invTab = i; setState('inv'); },
  levels: pg => { lvPage = pg; setState('levels'); }, setBiome: b => { biome = b; biomeDist = 0; }, finish: () => { finishX = GX; },
  dbg: () => ({ ghost, obstacles, pits, speed, finishX, levelLen, runStars, state, biome }), forceJump: () => jump(), press: () => press(null), levelDef };
})();
