/* ================= HD : lissage pixel art (Scale2x) ================= */
function scale2x(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const g = (r, c) => (r < 0 || r >= h || c < 0 || c >= w) ? '.' : (rows[r][c] || '.');
  const out = [];
  for (let r = 0; r < h; r++) {
    let a = '', b = '';
    for (let c = 0; c < w; c++) {
      const E = g(r, c), B = g(r - 1, c), D = g(r, c - 1), F = g(r, c + 1), Hh = g(r + 1, c);
      let e0 = E, e1 = E, e2 = E, e3 = E;
      if (B !== Hh && D !== F) {
        e0 = D === B ? D : E; e1 = B === F ? F : E;
        e2 = D === Hh ? D : E; e3 = Hh === F ? F : E;
      }
      a += e0 + e1; b += e2 + e3;
    }
    out.push(a, b);
  }
  return out;
}
const hdCache = new WeakMap();
function hd(rows) { let g = hdCache.get(rows); if (!g) { g = scale2x(rows); hdCache.set(rows, g); } return g; }
// dessine une grille en regroupant les pixels voisins (rapide)
function grid(g, x, y, cell, ch = '#', extraW = 0) {
  for (let r = 0; r < g.length; r++) {
    const row = g[r]; let c = 0;
    while (c < row.length) {
      if (row[c] === ch) { const s = c; while (c < row.length && row[c] === ch) c++; ctx.fillRect(x + s * cell, y + r * cell, (c - s) * cell + extraW, cell); }
      else c++;
    }
  }
}

// motifs de trame (dithering) à la résolution HD
const patterns = new Map();
function dither(color, density = 2) {
  const key = color + density;
  if (patterns.has(key)) return patterns.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const x = c.getContext('2d'); x.fillStyle = color;
  const pts = density === 2 ? [[0,0],[2,0],[1,1],[3,1],[0,2],[2,2],[1,3],[3,3]] : [[0,0],[2,2]];
  for (const [a, b] of pts) x.fillRect(a, b, 1, 1);
  const p = ctx.createPattern(c, 'repeat');
  try { p.setTransform(new DOMMatrix().scale(0.5)); } catch (e) {}
  patterns.set(key, p);
  return p;
}

      it.dead = true;
      if (!it.coin) for (let i = 0; i < 5; i++) dust.push({ x: it.x + it.w / 2, y: GY - 1, vx: (i - 2) * 0.5, vy: -0.8 - Math.random(), life: 16 });

  r.items = r.items.filter(i => !i.dead);

}

/* ---------- Mini-jeu : Kart ---------- */
const LANES = [54, 90, 126], KY = 236;
const KART_OBS = [BARRIER, ROCK, TOMB_S];
function stepKart(dt) {
  const k = kart;
  k.v = 2.2 + score * 0.003;
  const dy = k.v * dt;
  k.road += dy; dist += dy;
  k.x += (LANES[k.lane] - k.x) * Math.min(1, 0.3 * dt);
  k.spawnIn -= dy;
  if (k.spawnIn <= 0) {
    const frames = Math.max(32, rnd(42, 72) * Math.max(0.6, 1 - score / 3000));
    k.spawnIn = k.v * frames;
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    const n = score > 150 && Math.random() < Math.min(0.55, score / 800) ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const slow = score > 200 && Math.random() < 0.2;
      const s = slow ? CART : KART_OBS[(Math.random() * KART_OBS.length) | 0];
      const w = s[0].length * 2, h = s.length * 2;
      k.items.push({ x: LANES[lanes[i]] - w / 2, y: -OY - h - 4, w, h, spr: s, slow });
    }
    if (Math.random() < 0.35) for (let j = 0; j < 3; j++) k.items.push({ x: LANES[lanes[2]] - 5, y: -OY - 20 - j * 18, w: 10, h: 10, coin: true });
  }
  if (Math.random() < 0.05 * dt) k.decor.push({ x: Math.random() < 0.5 ? rnd(2, 22) : rnd(150, 170), y: -OY - 20, s: Math.random() < 0.3 ? TOMB_S : TUFT });
  for (const d of k.decor) d.y += dy;
  k.decor = k.decor.filter(d => d.y < VH);
  const kx1 = k.x - 6, kx2 = k.x + 6, ky1 = KY + 2, ky2 = KY + 18;
  for (const it of k.items) {
    it.y += it.slow ? dy * 0.55 : dy;
    if (it.x + it.w - 2 > kx1 && it.x + 2 < kx2 && it.y + it.h - 2 > ky1 && it.y + 2 < ky2) {
      if (it.coin) { it.dead = true; runCoins++; beep(1320, 1980, 0.07, 'square', 0.035); }
      else return die();
    }
  }
  k.items = k.items.filter(i => !i.dead && i.y < VH);
}

function update(dt) {
  t += dt; stateT += dt;
  if (shakeT > 0) shakeT -= dt;
  if (toast) { toast.t += dt; if (toast.t > 90) toast = null; }
  for (const p of dust) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.05 * dt; p.life -= dt; }
  dust = dust.filter(p => p.life > 0);
  if (state === 'splash') { if (stateT > 170) setState('menu'); return; }
  if (state !== 'play' && state !== 'dying') return;
  if (state === 'dying') {
    shake = Math.max(0, shake - 0.4 * dt);
    if (mode === 'run' || mode === 'story') ghost.y -= 0.6 * dt;
    if (stateT > 50) { finishRun(); setState('over'); }
    return;
  }
  if (mode === 'run') speed = speedFor(score);
  if (mode === 'run' || mode === 'story') {
    const steps = Math.max(1, Math.ceil(speed * dt / 3));
    for (let i = 0; i < steps && state === 'play'; i++) stepRunner(dt / steps);
  } else if (mode === 'rain') stepRain(dt);
  else if (mode === 'kart') {
    const steps = Math.max(1, Math.ceil(kart.v * dt / 3));
    for (let i = 0; i < steps && state === 'play'; i++) stepKart(dt / steps);
  }
  if (state !== 'play') return;

  const ns = mode === 'rain' ? Math.floor(dist / 6) : Math.floor(dist / 10);
  if (ns !== score) {
    score = ns;
    if (scoreMode() && score >= lastMilestone + 100) { lastMilestone = score - (score % 100); beep(880, 1320, 0.15, 'triangle', 0.06); }
    if (mode === 'run' && score >= DJ_SCORE && !djShown) { djShown = true; showBanner({ a: T('dj'), b: T('dj2') }); beep(660, 1320, 0.3, 'triangle', 0.07); }
  }
  if (!passedBest && score > bestAtStart) { passedBest = true; showBanner({ a: T('rec') }); beep(660, 1760, 0.35, 'triangle', 0.07); }
  if (scoreMode()) {
    const inv = Math.floor(score / 500) % 2;
    if (inv !== lastInv) { lastInv = inv; flash = 1; showBanner({ a: T('invert') }); beep(220, 880, 0.35, 'square', 0.05); }
  }
  if (flash > 0) flash = Math.max(0, flash - 0.04 * dt);
  if (banner) { banner.t += dt; if (banner.t > 130) banner = bannerQ.shift() || null; }
  if ((mode === 'run' || mode === 'story') && (t | 0) % 4 === 0 && Math.random() < 0.6) trail.push({ x: GX - 2, y: ghost.y - 6 - (Math.random() * 12 | 0), life: 22 });
  if (mode === 'rain' && holdDir && (t | 0) % 3 === 0) trail.push({ x: rain.x + (holdDir > 0 ? -2 : 24), y: ghost.y - 6 - (Math.random() * 12 | 0), life: 14, vx: -holdDir });
  for (const p of trail) { p.x += p.vx != null ? p.vx * dt : -(speed * dt * 0.6 + 0.3 * dt); p.life -= dt; }
  trail = trail.filter(p => p.life > 0);
}

/* ================= Dessin : utilitaires ================= */
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function drawGround(sc, pitList, gy = GY) {
  let x = 0;
  const sorted = [...pitList].sort((a, b) => a.x - b.x);
  for (const p of sorted) {
    const px = r2(p.x), pw = r2(p.w);
    if (px > x) ctx.fillRect(x, gy, px - x, 1);
    ctx.fillRect(px, gy, 1, PIT_D + 1);
    ctx.fillRect(px + pw, gy, 1, PIT_D + 1);
    ctx.fillRect(px, gy + PIT_D, pw + 1, 1);
    x = Math.max(x, px + pw + 1);
  }
  if (x < W) ctx.fillRect(x, gy, W - x, 1);
  // terre : petits grains en HD (demi-pixels) + quelques gros
  const start = Math.floor(sc / 3), depth = Math.max(34, VH - OY - gy - 4);
  for (let i = start; i < start + W / 3 + 2; i++) {
    const sx = r2(i * 3 - sc);
    for (let k = 0; k < 4; k++) {
      if (hash(i * 7 + k * 13) > 0.5) continue;
      const ry = hash(i * 3 + k * 29);
      const y = gy + 3 + Math.floor(ry * ry * depth * 2) / 2;
      let blocked = false;
      for (const p of pitList) if (sx >= p.x - 1 && sx <= p.x + p.w + 1 && y < gy + PIT_D + 3) blocked = true;
      if (!blocked) { const big = hash(i * 11 + k) < 0.25; ctx.fillRect(sx, y, big ? 1 : 0.5, big ? 1 : 0.5); }
    }
  }
}
// collines lointaines en parallaxe, remplies d'une trame HD
function drawHills(sc) {
  const hy = x => GY - 16 - (Math.sin((x + sc) * 0.013) * 8 + Math.sin((x + sc) * 0.031 + 1) * 5 + 6);
  ctx.beginPath(); ctx.moveTo(0, GY);
  for (let x = 0; x <= W; x += 1) ctx.lineTo(x, Math.round(hy(x) * 2) / 2);
  ctx.lineTo(W, GY); ctx.closePath();
  ctx.fillStyle = dither(FG, 1); ctx.fill();
  ctx.fillStyle = FG;
  for (let x = 0; x < W; x += 0.5) ctx.fillRect(x, Math.round(hy(x) * 2) / 2, 0.5, 0.5);
  // petites croix lointaines sur les collines
  const s0 = Math.floor(sc / 47);
  for (let i = s0; i < s0 + 6; i++) {
    if (hash(i * 5) < 0.45) continue;
    const x = r2(i * 47 - sc + hash(i) * 20);
    if (x < -4 || x > W) continue;
    const y = Math.round(hy(x) * 2) / 2;
    ctx.fillRect(x + 1, y - 5, 0.5, 5); ctx.fillRect(x, y - 4, 2.5, 0.5);
  }
}
function box(x, y, w, h) {
  ctx.fillRect(x + 2, y, w - 4, 1); ctx.fillRect(x + 2, y + h - 1, w - 4, 1);
  ctx.fillRect(x, y + 2, 1, h - 4); ctx.fillRect(x + w - 1, y + 2, 1, h - 4);
  ctx.fillRect(x + 1, y + 1, 1, 1); ctx.fillRect(x + w - 2, y + 1, 1, 1);
  ctx.fillRect(x + 1, y + h - 2, 1, 1); ctx.fillRect(x + w - 2, y + h - 2, 1, 1);
}
function circle(cx, cy, r, fill) { // cercle tracé sur la grille HD
  const R = r * 2, X = cx * 2, Y = cy * 2;
  let x = R, y = 0, err = 1 - R;
  const pt = (a, b, w = 1) => ctx.fillRect((X + a) / 2, (Y + b) / 2, w / 2, 0.5);
  while (x >= y) {
    if (fill) { pt(-x, y, 2 * x + 1); pt(-x, -y, 2 * x + 1); pt(-y, x, 2 * y + 1); pt(-y, -x, 2 * y + 1); }
    else for (const [a, b] of [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]]) { pt(a, b); pt(a + (a > 0 ? -1 : 1), b); }
    y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}
function drawButton(label, b, filled = false) {
  if (filled) { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.fillStyle = BG; }
  else box(b.x, b.y, b.w, b.h);
  const s = b.h >= 20 && textW(label, 2) < b.w - 12 ? 2 : 1;
  text(label, b.x + b.w / 2, b.y + Math.round((b.h - 7 * s) / 2), s, s === 2);
  ctx.fillStyle = FG;
}

/* ================= Boutique ================= */
const TAB = [{ x: 10, y: 44, w: 78, h: 15 }, { x: 92, y: 44, w: 78, h: 15 }];
const card = i => ({ x: 6 + (i % 3) * 57, y: 66 + Math.floor(i / 3) * 61, w: 54, h: 57 });
const PG_L = { x: 46, y: 250, w: 18, h: 14 }, PG_R = { x: 116, y: 250, w: 18, h: 14 };
const SHOP_BACK = { x: 40, y: 278, w: 100, h: 24 };
const packRow = i => ({ x: 8, y: 66 + i * 39, w: 164, h: 33 });
const MOD_OK = { x: 24, y: 192, w: 62, h: 20 }, MOD_NO = { x: 94, y: 192, w: 62, h: 20 };
function drawShop() {
  text(T('shop'), W / 2, 8, 2, true);
  drawCoinCount(save.coins, W / 2 + 16, 27);
  for (let i = 0; i < 2; i++) {
    const b = TAB[i], lbl = i ? T('coins') : T('skins');
    if (shopTab === i) { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.fillStyle = BG; text(lbl, b.x + b.w / 2, b.y + 4, 1); ctx.fillStyle = FG; }
    else { box(b.x, b.y, b.w, b.h); text(lbl, b.x + b.w / 2, b.y + 4, 1); }
  }
  if (shopTab === 0) drawSkinGrid(); else drawPacks();
  drawButton(T('back'), SHOP_BACK);
  if (toast) { ctx.fillStyle = BG; ctx.fillRect(30, 140, 120, 30); ctx.fillStyle = FG; box(30, 140, 120, 30); text(toast.a, W / 2, 152, 1, true); }
  if (modal) drawModal();
}
function drawSkinGrid() {
  for (let j = 0; j < PER_PAGE; j++) {
    const idx = shopPage * PER_PAGE + j, sk = SKINS[idx];
    if (!sk) break;
    let c = card(j);
    if (shake_i === idx && shakeT > 0) c = { ...c, x: c.x + Math.round(Math.sin(shakeT * 1.5) * 3) };
    const owned = save.skins.includes(sk.id), equipped = save.skin === sk.id;
    box(c.x, c.y, c.w, c.h);
    if (equipped) box(c.x + 2, c.y + 2, c.w - 4, c.h - 4);
    drawGhost(c.x + 14, c.y + 34, ((t / 12) | 0) + j, false, sk.id);
    text(sk.id.toUpperCase(), c.x + c.w / 2, c.y + 38, 1);
    if (equipped) text(T('equip'), c.x + c.w / 2, c.y + 48, 1);
    else if (owned) spr(CHECK, c.x + c.w / 2 - 4, c.y + 48, 1);
    else { const ps = String(sk.price), wTot = textW(ps, 1) + 8; spr(coinFrame(0), c.x + c.w / 2 - wTot / 2, c.y + 48, 1); text(ps, c.x + c.w / 2 - wTot / 2 + 8, c.y + 48, 1, false, 'l'); }
  }
  box(PG_L.x, PG_L.y, PG_L.w, PG_L.h); spr(ARROW_L, PG_L.x + 6, PG_L.y + 2, 2);
  box(PG_R.x, PG_R.y, PG_R.w, PG_R.h); spr(ARROW_R, PG_R.x + 6, PG_R.y + 2, 2);
  text((shopPage + 1) + '/' + PAGES, W / 2, PG_L.y + 4, 1);
}
function drawCoinStack(x, y, n) {
  for (let i = 0; i < n; i++) { ctx.fillStyle = BG; ctx.fillRect(x + i * 3 - 1, y - i * 3 - 1, 12, 12); ctx.fillStyle = FG; spr(COIN[0], x + i * 3, y - i * 3, 2); }
}
function drawPacks() {
  PACKS.forEach((p, i) => {
    const r = packRow(i);
    box(r.x, r.y, r.w, r.h);
    if (p.popular) box(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
    drawCoinStack(r.x + 8, r.y + 16, Math.min(4, i + 1));
    text(String(p.coins), r.x + 40, r.y + (p.popular ? 5 : 9), 2, true, 'l');
    if (p.popular) { const lw = textW(T('popular'), 1) + 6; ctx.fillRect(r.x + 40, r.y + 22, lw, 9); ctx.fillStyle = BG; text(T('popular'), r.x + 43, r.y + 23, 1, false, 'l'); ctx.fillStyle = FG; }
    const pb = { x: r.x + r.w - 54, y: r.y + 7, w: 48, h: 19 };
    ctx.fillRect(pb.x, pb.y, pb.w, pb.h); ctx.fillStyle = BG; text(priceLabel(p), pb.x + pb.w / 2, pb.y + 6, 1); ctx.fillStyle = FG;
  });
}
function drawModal() {
  ctx.globalAlpha = 0.6; ctx.fillStyle = BG; ctx.fillRect(0, -OY, W, VH); ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(14, 96, 152, 126); ctx.fillStyle = FG;
  box(14, 96, 152, 126); box(16, 98, 148, 122);
  text(T('demo'), W / 2, 108, 1, true); text(T('noPay'), W / 2, 122, 1);
  const s = '+' + modal.coins; text(s, W / 2 + 7, 142, 2, true); spr(COIN[0], W / 2 - textW(s, 2) / 2 - 8, 143, 2);
  text(priceLabel(modal), W / 2, 168, 1);
  drawButton(T('ok'), MOD_OK); drawButton(T('cancel'), MOD_NO);
}

/* ================= Jeu ================= */
function drawRunnerScene() {
  drawStars();
  drawHills(scroll * 0.25);
  drawClouds();
  for (const tf of tufts) if (!inPit(tf.x + 2) && !inPit(tf.x + 8)) spr(TUFT, tf.x, GY - 5);
  if (mode === 'run' && !passedBest) {
    const rx = r2(GX + 13 + (bestAtStart * 10 - dist));
    if (rx > -4 && rx < W + 40) {
      for (let y = GY - 70; y < GY; y += 3) ctx.fillRect(rx, y, 0.5, 1.5);
      text(T('recShort'), rx + 3, GY - 76, 1, false, 'l');
    }
  }
  if (mode === 'story' && finishX < W + 20) { // ligne d'arrivée
    const fx = r2(finishX);
    ctx.fillRect(fx, GY - 56, 1, 56);
    for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 0) ctx.fillRect(fx + 1 + c * 1.5, GY - 56 + r * 1.5, 1.5, 1.5);
    for (let y = GY + 2; y < GY + 30; y += 2) ctx.fillRect(fx + ((y / 2) % 2), y, 1, 1);
  }
  for (const o of obstacles) {
    if (o.x > W + 30) continue;
    if (o.type === 'bat') spr(BAT[((t / 6) | 0) % 2], o.x, o.y);
    else spr(o.spr, o.x, GY - o.h + 1);
  }
  for (const c of coins) if (c.x < W + 20) spr(coinFrame(((t / 6) | 0) + (c.x | 0)), c.x, c.y, 2);
  for (const s of starsL) if (s.x < W + 20) spr(STAR, s.x, s.y + Math.sin(t * 0.1 + s.x) * 1.5, 2);
  drawGround(scroll, pits);
  for (const p of trail) ctx.fillRect(r2(p.x), r2(p.y), p.life > 11 ? 5 : 2.5, p.life > 11 ? 1.5 : 1);
  drawDust();
  if (!(state === 'dying' && (stateT / 4 | 0) % 2)) drawGhost(GX, ghost.y, (t / 8) | 0, state === 'dying');
}
function drawRainScene() {
  drawStars();
  drawHills(0);
  for (const it of rain.items) {
    if (!it.coin) { const pr = Math.max(0, Math.min(1, (it.y + OY) / (GY + OY))); ctx.fillRect(r2(it.x + it.w / 2 - 3 * pr), GY + 2, r2(6 * pr) || 0.5, 0.5); }
    spr(it.coin ? coinFrame(((t / 6) | 0) + (it.x | 0)) : it.spr, it.x, it.y, 2);
  }
  drawGround(0, []);
  for (const p of trail) ctx.fillRect(r2(p.x), r2(p.y), p.life > 7 ? 4 : 2, 1);
  drawDust();
  if (!(state === 'dying' && (stateT / 4 | 0) % 2)) drawGhost(rain.x, ghost.y, (t / 8) | 0, state === 'dying');
}
function drawKartScene() {
  const k = kart;
  ctx.fillStyle = dither(FG, 1); ctx.fillRect(0, -OY, 34, VH); ctx.fillRect(146, -OY, 34, VH); ctx.fillStyle = FG;
  for (const d of k.decor) { ctx.fillStyle = BG; ctx.fillRect(d.x - 1, d.y - 1, d.s[0].length * 2 + 2, d.s.length * 2 + 2); ctx.fillStyle = FG; spr(d.s, d.x, d.y, 2); }
  ctx.fillRect(34, -OY, 1, VH); ctx.fillRect(145, -OY, 1, VH);
  const off = k.road % 16;
  for (const lx of [72, 108]) for (let y = -OY - 16 + off; y < VH - OY; y += 16) ctx.fillRect(lx - 0.5, r2(y), 1, 8);
  for (const it of k.items) {
    if (it.coin) spr(coinFrame(((t / 6) | 0) + (it.y | 0)), it.x, it.y, 2);
    else { spr(it.spr, it.x, it.y, 2); if (it.slow) drawGhost(it.x + 1.5, it.y + 14, 0, false, 'shadow', 1); }
  }
  drawDust();
  if (!(state === 'dying' && (stateT / 4 | 0) % 2)) {
    const tilt = (LANES[k.lane] - k.x) * 0.15;
    spr(CART, k.x - 8 - tilt, KY, 2);
    drawGhost(k.x - 6.5 - tilt, KY + 14, (t / 8) | 0, state === 'dying', save.skin, 1);
    if (state === 'play' && (t | 0) % 3 === 0) dust.push({ x: k.x - 6 + Math.random() * 12, y: KY + 21, vx: (Math.random() - 0.5) * 0.4, vy: 0.8, life: 10 });
  }
}
function drawHUD() {
  screenT();
  box(8, 8, 16, 16); ctx.fillRect(13, 12, 2, 8); ctx.fillRect(17, 12, 2, 8);
  if (mode === 'story') {
    const prog = Math.max(0, Math.min(1, 1 - (finishX - GX) / levelLen));
    box(32, 12, 92, 8); ctx.fillRect(34, 14, r2(88 * prog), 4);
    for (let s = 0; s < 3; s++) drawStarIcon(130 + s * 15, 10, 2, s < runStars);
    drawCoinCount(runCoins, W - 8, 28);
  } else {
    text(pad(score), W - 8, 10, 2, true, 'r');
    drawCoinCount(runCoins, W - 8, 28);
  }
  if (mode === 'run' && hasDJ()) { ctx.fillRect(30, 13, 4, 4); if (ghost.jumps < 2) ctx.fillRect(36, 13, 4, 4); else box(36, 13, 4, 4); }
  sceneT();
  if (banner && (banner.t < 100 || ((banner.t / 5) | 0) % 2)) {
    const bw = Math.max(textW(banner.a, 1), banner.b ? textW(banner.b, 1) : 0) + 10;
    ctx.fillStyle = BG; ctx.fillRect(W / 2 - bw / 2, 57, bw, banner.b ? 27 : 17); ctx.fillStyle = FG;
    text(banner.a, W / 2, 62, 1, true);
    if (banner.b) text(banner.b, W / 2, 74, 1);
  }
  if (state === 'pause') {
    ctx.fillStyle = BG; ctx.fillRect(18, 100, 144, 96);
    ctx.fillStyle = FG; box(18, 100, 144, 96);
    text(T('pause'), W / 2, 112, 3, true);
    text(T('resume'), W / 2, 142, 1);
    drawButton(T('menu'), PAUSE_MENU);
  }
}
const PAUSE_MENU = { x: 50, y: 166, w: 80, h: 18 };
function drawPlay() {
  if (mode === 'rain') drawRainScene();
  else if (mode === 'kart') drawKartScene();
  else drawRunnerScene();
  drawHUD();
}

function render() {
  sceneT();
  if (state === 'splash') { document.body.style.background = stateT > 150 ? '#000' : RED; return drawSplash(); }
  const inGame = state === 'play' || state === 'pause' || state === 'dying';
  const inv = inGame && scoreMode() && Math.floor(score / 500) % 2 === 1;
  FG = inv ? '#000' : '#fff'; BG = inv ? '#fff' : '#000';
  if (document.body.style.background !== BG) document.body.style.background = BG;
  screenT(); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, VH);
  if (shake > 0 && state === 'dying') sceneT(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  else sceneT();
  ctx.fillStyle = FG;
  if (state === 'menu') drawMenu();
  else if (state === 'over') drawOver();
  else if (state === 'shop') drawShop();
  else if (state === 'levels') drawLevels();
  else if (state === 'minis') drawMinis();
  else if (state === 'clear') drawClear();
  else drawPlay();
  if (flash > 0 && state !== 'menu') { screenT(); ctx.globalAlpha = flash * 0.8; ctx.fillStyle = FG; ctx.fillRect(0, 0, W, VH); ctx.globalAlpha = 1; }
}

/* ================= Achats ================= */
function tryBuySkin(idx) {
  const sk = SKINS[idx];
  if (!sk) return;
  if (save.skins.includes(sk.id)) { save.skin = sk.id; beep(660, 990, 0.08); }
  else if (save.coins >= sk.price) { save.coins -= sk.price; save.skins.push(sk.id); save.skin = sk.id; beep(880, 1760, 0.2, 'triangle', 0.07); }
  else { shake_i = idx; shakeT = 18; beep(200, 120, 0.15, 'square', 0.05); return; }
  persist();
}
function grantPack(p) { save.coins += p.coins; persist(); toast = { a: T('thanks'), t: 0 }; beep(880, 1760, 0.3, 'triangle', 0.07); }
async function buyPack(p) {
  if (window.PhantoIAP && typeof window.PhantoIAP.purchase === 'function') {
    try { if (await window.PhantoIAP.purchase(p.id)) grantPack(p); } catch (e) {}
  } else modal = p;
}

/* ================= Entrées ================= */
const hit = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const hitC = (p, c, pd = 3) => p && Math.hypot(p.x - c.x, p.y - c.y) <= c.r + pd;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  const sy = (e.clientY - r.top) / r.height * VH;
  return { x: (e.clientX - r.left) / r.width * W, y: sy - OY, sy };
}
function go(s) { setState(s); beep(500, 700, 0.05); }
function toMenuFromGame() { if (runCoins && (state === 'pause')) { save.coins += runCoins; persist(); } setState(mode === 'story' ? 'levels' : 'menu'); }
let activePointer = null;
function press(p, pid) {
  audio();
  if (state === 'splash') { if (stateT > 20) setState('menu'); return; }
  if (state === 'menu') {
    if (p && hit({ x: p.x, y: p.sy }, LANG_BTN)) { save.lang = LANGS[(LANGS.indexOf(save.lang) + 1) % LANGS.length]; persist(); beep(500, 700, 0.05); return; }
    if (p && hit({ x: p.x, y: p.sy }, SND_BTN)) { save.muted = !save.muted; persist(); beep(500, 700, 0.05); return; }
    if (p && p.sy < 26 && p.x > 110) { shopTab = 1; return go('shop'); }
    if (!p || hitC(p, PLAY, 8)) return startGame('run');
    if (hitC(p, ORB.story)) return go('levels');
    if (hitC(p, ORB.minis)) return go('minis');
    if (hitC(p, ORB.skins)) { shopTab = 0; return go('shop'); }
    if (hitC(p, ORB.store)) { shopTab = 1; return go('shop'); }
    return;
  }
  if (state === 'levels') {
    if (!p) { const nxt = LEVELS.findIndex((_, i) => levelUnlocked(i) && levelStars(i) < 0); return startGame('story', nxt < 0 ? 0 : nxt); }
    if (hit(p, BACK_BTN)) return go('menu');
    for (let i = 0; i < LEVELS.length; i++) if (hitC(p, lvlPos(i), 4)) {
      if (levelUnlocked(i)) return startGame('story', i);
      beep(200, 120, 0.15, 'square', 0.05); return;
    }
    return;
  }
  if (state === 'minis') {
    if (!p) return startGame('rain');
    if (hit(p, BACK_BTN)) return go('menu');
    for (const c of MINI_CARDS) if (hit(p, c)) return startGame(c.id);
    return;
  }
  if (state === 'shop') {
    if (!p) return;
    if (modal) { if (hit(p, MOD_OK)) { grantPack(modal); modal = null; } else if (hit(p, MOD_NO)) modal = null; return; }
    if (hit(p, SHOP_BACK)) { setState('menu'); return; }
    for (let i = 0; i < 2; i++) if (hit(p, TAB[i])) { shopTab = i; beep(500, 700, 0.04); return; }
    if (shopTab === 0) {
      if (hit(p, PG_L)) { shopPage = (shopPage + PAGES - 1) % PAGES; beep(500, 600, 0.04); return; }
      if (hit(p, PG_R)) { shopPage = (shopPage + 1) % PAGES; beep(500, 600, 0.04); return; }
      for (let j = 0; j < PER_PAGE; j++) if (hit(p, card(j))) return tryBuySkin(shopPage * PER_PAGE + j);
    } else for (let i = 0; i < PACKS.length; i++) if (hit(p, packRow(i))) return buyPack(PACKS[i]);
    return;
  }
  if (state === 'clear') {
    if (stateT < 40) return;
    if (!p || hit(p, BTN)) { if (levelIdx + 1 < LEVELS.length) return startGame('story', levelIdx + 1); return go('levels'); }
    if (hit(p, SUB)) return go('levels');
    return;
  }
  if (state === 'over') {
    if (stateT < 25) return;
    if (!p || hit(p, BTN)) return startGame(mode, levelIdx);
    if (hit(p, SUB)) return setState(mode === 'story' ? 'levels' : 'menu');
    return;
  }
  if (state === 'pause') {
    if (hit(p, PAUSE_MENU)) return toMenuFromGame();
    setState('play'); return;
  }
  if (state === 'play') {
    if (p && p.x < 34 && p.sy < 34) { setState('pause'); return; }
    if (mode === 'run' || mode === 'story') jump();
    else {
      const dir = p ? (p.x < W / 2 ? -1 : 1) : 1;
      if (mode === 'rain') { holdDir = dir; activePointer = pid; }
      else { kart.lane = Math.max(0, Math.min(2, kart.lane + dir)); beep(500, 650, 0.04); }
    }
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(toLogical(e), e.pointerId); });
const releasePointer = e => { if (mode === 'rain' && (activePointer === null || e.pointerId === activePointer)) { holdDir = 0; activePointer = null; } };
addEventListener('pointerup', releasePointer);
addEventListener('pointercancel', releasePointer);
const keysDown = new Set();
addEventListener('keydown', e => {
  const k = e.code;
  if (state === 'play' && (mode === 'rain' || mode === 'kart') && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD')) {
    e.preventDefault();
    const dir = (k === 'ArrowLeft' || k === 'KeyA') ? -1 : 1;
    if (mode === 'rain') { keysDown.add(dir); holdDir = dir; }
    else if (!e.repeat) { kart.lane = Math.max(0, Math.min(2, kart.lane + dir)); beep(500, 650, 0.04); }
    return;
  }
  if (e.repeat) return;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') { e.preventDefault(); press(null); }
  else if (k === 'KeyP' || k === 'Escape') window.phantoBack();
  else if (k === 'KeyM') { save.muted = !save.muted; persist(); }
  else if (state === 'shop' && shopTab === 0 && k === 'ArrowRight') shopPage = (shopPage + 1) % PAGES;
  else if (state === 'shop' && shopTab === 0 && k === 'ArrowLeft') shopPage = (shopPage + PAGES - 1) % PAGES;
});
addEventListener('keyup', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') keysDown.delete(-1);
  if (k === 'ArrowRight' || k === 'KeyD') keysDown.delete(1);
  if (mode === 'rain' && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD')) holdDir = keysDown.size ? [...keysDown].pop() : 0;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('pause'); });

// appelé par l'app Android (bouton retour / mise en arrière-plan)
window.phantoBack = () => {
  if (state === 'play') { setState('pause'); return true; }
  if (state === 'pause') { setState('play'); return true; }
  if (state === 'shop') { if (modal) modal = null; else setState('menu'); return true; }
  if (state === 'levels' || state === 'minis') { setState('menu'); return true; }
  if (state === 'over' || state === 'clear') { setState(mode === 'story' ? 'levels' : 'menu'); return true; }
  return false;
};
window.phantoPause = () => { if (state === 'play') setState('pause'); };

/* ================= Boucle ================= */
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
resetCommon();
let last = performance.now();
function loop(now) {
  const dt = Math.min(3, (now - last) / (1000 / 60));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__phanto = { get state() { return state; }, set score(v) { dist = mode === 'rain' ? v * 6 : v * 10; }, save, setState, startGame,
  shop: (tab, page) => { shopTab = tab; shopPage = page || 0; setState('shop'); }, buy: i => buyPack(PACKS[i]),
  get mode() { return mode; }, dbg: () => ({ ghost, obstacles, pits, speed, finishX, levelLen, runStars, state }), forceJump: () => jump(), jump: () => press(null), finish: () => { finishX = GX; } };
})();
</script>
