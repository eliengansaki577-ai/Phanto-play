plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelstudio.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pixelstudio.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // fixed key: each new APK installs over the previous one
        debug {
            storeFile rootProject.file('keystore/pixelstudio-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
